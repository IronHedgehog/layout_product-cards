<!doctype html>
<html
  lang="en"
  class="page"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <body class="page__body">
    <article
      class="page__card card"
      data-qa="card"
    >
      <img
        class="card__img"
        src="./images/imac.jpeg"
        alt="imac photo"
      />
      <h1 class="card__title">
        APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
      </h1>
      <p class="card__product-code">Product code: 195434</p>
      <!-- <div class="card__feedback feedback">
        <div class="feedback__stars feedback__stars--4">
          <div class="feedback__star"></div>
          <div class="feedback__star"></div>
          <div class="feedback__star"></div>
          <div class="feedback__star"></div>
          <div class="feedback__star"></div>
        </div>
        <p class="feedback__count">Reviews: 5</p>
      </div> -->

      <div class="card__stars-container">
        <div class="card__stars stars stars--4">
          <div class="stars__item"></div>
          <div class="stars__item"></div>
          <div class="stars__item"></div>
          <div class="stars__item"></div>
          <div class="stars__item"></div>
        </div>
        <p class="card__reviews">Reviews: 5</p>
      </div>

      <div class="card__price price">
        <div class="price__text">Price:</div>
        <div class="price__value">$2,199</div>
      </div>

      <a
        class="card__link link"
        href="#"
        data-qa="hover"
      >
        Buy
      </a>
    </article>
  </body>
</html>
